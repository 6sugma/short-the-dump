[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "short-the-dump"
version = "0.1.0"
description = "Point-in-time research, alerting, paper-trading, and borrow-aware backtesting for extreme small-cap momentum events."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Short the Dump contributors" }]
keywords = ["quantitative-research", "small-cap", "backtesting", "market-microstructure", "risk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
short-the-dump = "short_the_dump.cli:main"

[project.urls]
Repository = "https://github.com/6sugma/short-the-dump"
Issues = "https://github.com/6sugma/short-the-dump/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/short_the_dump"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
